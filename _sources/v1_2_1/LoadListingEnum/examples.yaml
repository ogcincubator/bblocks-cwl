examples:
  - title: Deep listing
    content: |
      Requesting a fully recursive directory listing, so subdirectories are also expanded for use
      in expressions.
    snippets:
      - language: json
        code: |
          "deep_listing"
  - title: No listing
    content: |
      Suppressing the directory listing entirely, so `listing` is left unset on the `Directory` object.
    snippets:
      - language: json
        code: |
          "no_listing"
