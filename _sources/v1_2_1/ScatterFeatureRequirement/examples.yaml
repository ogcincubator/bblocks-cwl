examples:
  - title: Enabling scatter/gather on a Workflow
    content: |
      Adapted from the CWL conformance test `scatter-wf3.cwl`: a `Workflow` declares
      `ScatterFeatureRequirement` in its `requirements` so that one of its steps can use the
      `scatter`/`scatterMethod` fields of [CWLWorkflowStepObject](bblocks://ogc.cwl.v1_2_1.CWLWorkflowStepObject).
    snippets:
      - language: json
        code: |
          {
            "class": "ScatterFeatureRequirement"
          }
