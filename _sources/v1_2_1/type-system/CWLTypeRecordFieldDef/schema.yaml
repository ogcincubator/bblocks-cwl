allOf:
- properties:
    name:
      $comment: 'Required if list item. Otherwise, optional since it is the mapping
        key.

        This requirement is defined in ''CWLTypeRecordFieldsItem'' to allow reuse of
        this schema.

        '
      type: string
    type:
      $ref: bblocks://ogc.cwl.v1_2_1.CWLType
  required:
    - type
  type: object
- $comment: 'Explicitly disallow these parameters when non-File type is detected.

    Otherwise, validate their schema definitions according to what is permitted.

    '
  description: Parameters that are only valid when 'type' or 'items' evaluates to 'File'.
  else:
    properties:
      format: false
      loadContents: false
      secondaryFiles: false
      streamable: false
  if:
    oneOf:
    - $comment: Single required or optional 'File'.
      properties:
        type:
          enum:
          - File
          - File?
          - File[]
          - File[]?
    - $comment: Array of required or optional 'File'.
      items:
        oneOf:
        - type: object
          properties:
            type:
              enum:
                - File
                - File?
        - contains:
            properties:
              type:
                enum:
                  - File
                  - File?
            type: array
      type: array
  then:
    $ref: bblocks://ogc.cwl.v1_2_1.CWLFileOnlyParameters
  type: object
- $comment: 'Explicitly disallow these parameters when non-Directory type is detected.

    Otherwise, validate their schema definitions according to what is permitted.

    '
  description: Parameters that are only valid when 'type' or 'items' evaluates to 'Directory'.
  else:
    properties:
      loadListing: false
  if:
    oneOf:
    - $comment: Single required or optional 'Directory'.
      properties:
        type:
          enum:
          - Directory
          - Directory?
          - Directory[]
          - Directory[]?
    - $comment: Array of required or optional 'Directory'.
      items:
        oneOf:
        - type: object
          properties:
            type:
              enum:
                - Directory
                - Directory?
        - contains:
            properties:
              type:
                enum:
                  - Directory
                  - Directory?
            type: array
      type: array
  then:
    $ref: bblocks://ogc.cwl.v1_2_1.CWLDirectoryOnlyParameters
  type: object
