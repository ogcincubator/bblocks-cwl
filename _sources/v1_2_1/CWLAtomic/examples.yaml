examples:
  - title: Simple CommandLineTool with list-form inputs and outputs
    content: |
      A minimal `CommandLineTool` document that pipes a file through `cat`, adapted from the
      CWL v1.2 conformance test suite. `inputs` and `outputs` are given as arrays of items, each
      identified by its own `id`.
    snippets:
      - language: json
        code: |
          {
            "cwlVersion": "v1.2",
            "class": "CommandLineTool",
            "baseCommand": ["cat"],
            "inputs": [
              {
                "id": "file1",
                "type": "File"
              }
            ],
            "outputs": [
              {
                "id": "output",
                "type": "File",
                "outputBinding": { "glob": "output" }
              }
            ],
            "stdin": "$(inputs.file1.path)",
            "stdout": "output"
          }
  - title: Dockerized CommandLineTool with mapping-form inputs and outputs
    content: |
      The same kind of tool as above, but with `inputs`/`outputs` given as an object keyed by
      identifier instead of an array, and a [DockerRequirement](bblocks://ogc.cwl.v1_2_1.DockerRequirement)
      declared under `hints` to pin the execution container.
    snippets:
      - language: json
        code: |
          {
            "cwlVersion": "v1.2",
            "class": "CommandLineTool",
            "doc": "Print the contents of a file to stdout using 'cat' running in a docker container.",
            "s:keywords": ["cat", "docker"],
            "hints": {
              "DockerRequirement": {
                "dockerPull": "docker.io/debian:stable-slim"
              }
            },
            "inputs": {
              "file1": {
                "type": "File",
                "label": "Input File",
                "doc": "The file that will be copied using 'cat'",
                "inputBinding": { "position": 1 }
              }
            },
            "outputs": {
              "output_file": {
                "type": "File",
                "outputBinding": { "glob": "output.txt" }
              }
            },
            "baseCommand": "cat",
            "stdout": "output.txt"
          }
