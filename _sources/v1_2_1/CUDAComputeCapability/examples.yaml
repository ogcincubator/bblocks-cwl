examples:
  - title: Single minimum compute capability
    content: |
      A single value defines only a minimum compute capability; GPUs with a higher capability are
      also accepted.
    snippets:
      - language: json
        code: |
          "1.0"
  - title: Explicit set of accepted compute capabilities
    content: |
      An array value ([CUDAComputeCapabilityArray](bblocks://ogc.cwl.v1_2_1.CUDAComputeCapabilityArray))
      restricts acceptance to GPUs whose compute capability explicitly appears in the list.
    snippets:
      - language: json
        code: |
          ["1.0", "2.0", "3.0"]
