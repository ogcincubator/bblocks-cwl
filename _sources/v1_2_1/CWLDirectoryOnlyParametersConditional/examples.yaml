examples:
  - title: loadListing on a single Directory input
    content: |
      When `type` resolves to `Directory`, `loadListing` is permitted and validated against
      [CWLDirectoryOnlyParameters](bblocks://ogc.cwl.v1_2_1.CWLDirectoryOnlyParameters), adapted
      from the CWL conformance test `listing_shallow2.cwl`.
    snippets:
      - language: json
        code: |
          {
            "type": "Directory",
            "loadListing": "shallow_listing"
          }
  - title: loadListing on an array of Directory inputs
    content: |
      `loadListing` is likewise permitted when `type` resolves to an array of `Directory`
      (`Directory[]`), requesting a recursive listing for every directory in the array.
    snippets:
      - language: json
        code: |
          {
            "type": "Directory[]",
            "loadListing": "deep_listing"
          }
